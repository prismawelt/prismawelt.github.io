/en/: 'Iheon Kim at POSTECH: research in resurgence and supersymmetric quantum field theory, with essays on anime, philosophy, memory, and everyday life.'
/en/ihatov/: 'IHATOV: Iheon Kim’s personal archive of photography and music.'
/en/ihatov/music/: 'IHATOV MUSIC: explore Iheon Kim’s music archive through albums, cover artwork, and ratings.'
/en/ihatov/photo/: 'IHATOV PHOTO: Iheon Kim’s photography archive.'
/en/links/: 'Contact details and links for Iheon Kim: POSTECH String Theory Group, GitHub, blog, music listening records, and social profiles.'
/en/nichijou/: Animation criticism and essays by Iheon Kim on everyday-life anime, photography, memory, philosophy, and otaku. Available in Korean, English, and Japanese.
/en/nichijou/koikaze_ed/: 'Koi Kaze’s ending as a frame of time: sandcastle traces, undelivered confessions, and the privileging of source material in a critique of endings that cannot be skipped.'
/en/nichijou/mono/: A defense of mono through photography, animation, self-reference, and ghosts. Wim Wenders’s Tokyo-Ga helps illuminate its relation to everyday-life anime and documentary.
/en/nichijou/onimai/: 'A critique of Onimai through everyday-life anime, TSF, and anti-growth: Mahiro’s transformation, hikikomori, character animation, and the recovery of everydayness.'
/en/nichijou/otaku-no-yume/: 'The otaku’s dream they want to dream, mourning, melancholy, and derivative creation: an essay on the double bind of fulfilling a dream and bringing it to an end.'
/en/nichijou/unspeakable/: 'Clouds, trees, waves, and the powerlessness of memory: Iheon Kim considers what cannot be said through one possible reading of Wittgenstein’s Tractatus 6.522.'
/en/physics/: Physics writing by Iheon Kim, including a downloadable undergraduate thesis on conformal field theory at finite temperature and thermal bootstrap.
/en/physics/bachelor_thesis/: Iheon Kim’s POSTECH undergraduate thesis, Analytic approaches to conformal field theory at finite temperature. Download the analytic thermal bootstrap thesis PDF.
/ja/: POSTECHで理論物理学を学ぶキム・イホンのサイト。Resurgenceとsupersymmetric quantum field theoryの研究、アニメーション・哲学・日常についての批評とエッセイ。
/ja/ihatov/: IHATOV：キム・イホンの写真と音楽の個人アーカイブ。
/ja/ihatov/music/: IHATOV MUSIC：アルバム、ジャケット、評価からたどるキム・イホンの音楽アーカイブ。
/ja/ihatov/photo/: IHATOV PHOTO：キム・イホンの写真アーカイブ。
/ja/links/: キム・イホンの連絡先と外部リンク。POSTECH String Theory Group、GitHub、ブログ、音楽の記録、ソーシャルプロフィール。
/ja/nichijou/: キム・イホンによるアニメーション批評とエッセイ。日常系、写真、記憶、哲学、オタクをめぐる文章を韓国語・英語・日本語で公開。
/ja/nichijou/koikaze_ed/: 『恋風』のエンディングを時間の額縁と砂の城の痕跡から読む。原作中心主義、届かない告白、スキップできないエンディングをめぐる批評。
/ja/nichijou/mono/: 写真、作画、自己言及、幽霊から《mono》を読む。ヴィム・ヴェンダース《東京画》を補助線に、日常系とドキュメンタリーの関係を考える批評。
/ja/nichijou/onimai/: TVアニメ『お兄ちゃんはおしまい！』を日常系、TSF、反成長から読む。まひろの変化、演技作画、ひきこもりと日常性をめぐる批評。
/ja/nichijou/otaku-no-yume/: オタクの「見たい夢」を哀悼、メランコリー、二次創作から考える。夢の実現と終結がもたらす二重拘束を論じるエッセイ。
/ja/nichijou/unspeakable/: 雲、木、波と記憶の無力さから、語りえないものを考える。ウィトゲンシュタイン『論考』6.522についての、キム・イホンによるひとつの解釈。
/ja/physics/: キム・イホンのphysicsに関する文章と学士論文。Conformal field theoryとthermal bootstrapについてのノートとPDF資料。
/ja/physics/bachelor_thesis/: キム・イホンのPOSTECH学士論文、Analytic approaches to conformal field theory at finite temperature。Analytic thermal bootstrapに関する論文PDF。
/ko/: 김이헌(Iheon Kim)의 홈페이지. POSTECH에서 이론물리를 공부하며 Resurgence와 supersymmetric quantum field theory를 연구하고, 애니메이션·철학·일상에 관한 비평과 에세이를 씁니다.
/ko/ihatov/: 'IHATOV: 김이헌의 사진과 음악 기록을 모은 개인 아카이브.'
/ko/ihatov/music/: 'IHATOV MUSIC: 김이헌이 기록한 음악과 앨범, 커버 이미지 및 평가를 탐색하는 아카이브.'
/ko/ihatov/photo/: 'IHATOV PHOTO: 김이헌의 사진 아카이브.'
/ko/links/: 김이헌의 연락처와 외부 링크. POSTECH String Theory Group, GitHub, 블로그, 음악 기록 및 소셜 계정.
/ko/nichijou/: 김이헌의 애니메이션 비평과 에세이. 일상계, 사진, 기억, 철학과 오타쿠에 관한 글을 한국어·영어·일본어로 읽을 수 있습니다.
/ko/nichijou/koikaze_ed/: TV 애니메이션 『연풍』의 엔딩을 시간의 액자와 모래성의 흔적으로 읽는다. 원작 중심주의, 도달하지 못한 고백, 스킵할 수 없는 엔딩에 관한 비평.
/ko/nichijou/mono/: 《mono》의 사진, 작화, 자기언급과 유령을 통해 일상계와 다큐멘터리의 관계를 읽는다. 빔 벤더스의 《도쿄가》를 보조선으로 삼은 애니메이션 비평.
/ko/nichijou/onimai/: TV 애니메이션 『오빠는 끝!』을 일상계, TSF, 반성장의 관점에서 읽는다. 마히로의 변화와 히키코모리의 일상성을 다루는 김이헌의 비평.
/ko/nichijou/otaku-no-yume/: 오타쿠의 '꾸고 싶은 꿈'을 애도, 멜랑콜리, 2차 창작과 연결한다. 꿈의 실현과 종결이 만드는 이중 구속을 다루는 김이헌의 에세이.
/ko/nichijou/unspeakable/: 구름, 나무, 파도와 기억의 무능력을 통해 말해질 수 없는 것들을 생각한다. 비트겐슈타인 『논고』 6.522에 대한 김이헌의 한 가지 해석.
/ko/physics/: 김이헌의 physics 글과 학사논문. Conformal field theory와 thermal bootstrap에 관한 노트 및 PDF 자료.
/ko/physics/bachelor_thesis/: '김이헌의 POSTECH 학사논문: Analytic approaches to conformal field theory at finite temperature. Analytic thermal bootstrap에 관한 논문의 PDF.'
