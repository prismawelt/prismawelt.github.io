---
layout: default
---
<main class="page detail-page">
  <div class="detail-floating-title" aria-hidden="true" data-nosnippet>{{ page.title }}</div>
  <a class="back-link" href="{{ page.parent_permalink | relative_url }}">← BACK</a>
  <article id="article" aria-labelledby="article-title">
    <div class="detail-head">
      <div class="detail-meta">
        <span>{{ page.series }}</span>
        <span>{{ page.type }}</span>
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y.%m.%d' }}</time>
      </div>
      <h1 class="detail-title" id="article-title">{{ page.title }}</h1>
    </div>
    <div class="detail-body">
      {{ content }}
    </div>
  </article>
  {% include comments.html %}
</main>
