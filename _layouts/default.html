<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="google-site-verification" content="Co4yL4q2ScFPCkV-HMeISwIRFabl_Qv1olFsf-4ho0g" />
  <title>{{ site.title }}{% if page.title and page.title != 'HOME' %} — {{ page.title }}{% endif %}</title>

  <script>
    (function () {
      var theme = 'light';
      try {
        var savedTheme = localStorage.getItem('prismawelt-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme;
        }
      } catch (error) {
        theme = 'light';
      }

      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#1e1e1e' : '#ffffff'
      );
    }());
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=38' | relative_url }}">
  
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<div class="site-shell">
  {% assign l = page.lang | default: 'ko' %}

  <header class="site-header">
    <a class="site-title" href="{{ '/' | append:l | append:'/' | relative_url }}">prismawelt</a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">≡</button>

    <ul class="menu-list" id="site-menu">
      <li><a href="{{ '/' | append:l | append:'/nichijou/' | relative_url }}" {% if page.section == 'nichijou' %}class="active"{% endif %}>{% if l == 'en' %}NICHIJOU{% else %}日常{% endif %}</a></li>
      <li><a href="{{ '/' | append:l | append:'/physics/' | relative_url }}" {% if page.section == 'physics' %}class="active"{% endif %}>PHYSICS</a></li>
      <li><a href="{{ '/' | append:l | append:'/ihatov/' | relative_url }}" {% if page.section == 'ihatov' %}class="active"{% endif %}>IHATOV</a></li>
      <li><a href="{{ '/' | append:l | append:'/links/' | relative_url }}" {% if page.section == 'links' %}class="active"{% endif %}>LINKS</a></li>
    </ul>

    <div class="lang-list">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M12 2V4M12 20V22M4.9 4.9L6.3 6.3M17.7 17.7L19.1 19.1M2 12H4M20 12H22M4.9 19.1L6.3 17.7M17.7 6.3L19.1 4.9"></path>
        </svg>
      </button>
      <a href="{{ page.lang_ko | default:'/ko/' | relative_url }}">KO</a>
      <a href="{{ page.lang_en | default:'/en/' | relative_url }}">EN</a>
      <a href="{{ page.lang_ja | default:'/ja/' | relative_url }}">JA</a>
    </div>
  </header>

  <div class="menu-overlay" aria-hidden="true"></div>

  {{ content }}
</div>

<script src="{{ '/assets/js/theme.js' | relative_url }}?v=3"></script>
<script src="{{ '/assets/js/captionify.js' | relative_url }}"></script>
<script src="{{ '/assets/js/archive.js?v=33' | relative_url }}"></script>

<script src="https://unpkg.com/littlefoot/dist/littlefoot.js" type="application/javascript"></script>
<script type="application/javascript">
  littlefoot.default({
    activateOnHover: true,
    dismissOnUnhover: false,
    hoverDelay: 0,
    /* 클래스 이름 변경: littlefoot__button */
    buttonTemplate: '<button class="littlefoot__button" title="Footnote <% number %>">[<% number %>]</button>'
  });
</script>

</body>
</html>
